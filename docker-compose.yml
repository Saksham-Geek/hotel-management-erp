
# Development database. Production compose (with memory limits) comes later.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_owner
      POSTGRES_PASSWORD: erp_owner_dev
      POSTGRES_DB: erp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_owner -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
